# mwagent CI (PLAN-001 WS-7). Actions are pinned to commit SHAs (version in the trailing comment).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build-test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '17']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # JDK 9+ builds with --release 8 (pom profile release-8). Includes the JaCoCo coverage ratchet
      - run: mvn -B verify
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: build/surefire-reports/

  lib-integrity:
    # Offline build path: lib/*.jar are not in git. Download, verify SHA256SUMS, compare with pom.xml, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - run: bash download-dependencies.sh
      - run: bash verify-lib.sh
      - run: bash scripts/check-lib-matches-pom.sh
      - run: bash build-offline.sh

  secrets:
    # Private original: current files only (dir mode). Baseline of known examples in .gitleaksignore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >-
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1
          dir /repo --no-banner --redact --verbose

  deps:
    # Known-vulnerable dependencies in the shipped jars (lib/) and in pom.xml (including transitive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash download-dependencies.sh
      - run: >-
          docker run --rm -v "$PWD/lib:/scan:ro" aquasec/trivy:0.74.0
          rootfs /scan --scanners vuln --exit-code 1 --no-progress
      - run: >-
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.74.0
          fs /src/pom.xml --scanners vuln --exit-code 1 --no-progress

  sast-spotbugs:
    # SpotBugs + FindSecBugs against the triaged baseline (config/spotbugs-exclude.xml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B compile com.github.spotbugs:spotbugs-maven-plugin:check
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spotbugs
          path: build/spotbugsXml.xml
